<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduAdmit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=Noto+Sans+Malayalam:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/primeicons@7.0.0/primeicons.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="side-brand">
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 21.5 9 12 13.5 2.5 9z" fill="#fff" stroke="none"/><path d="M6.5 11.6 12 14.2l5.5-2.6v3.4c0 1.7-2.5 3.1-5.5 3.1s-5.5-1.4-5.5-3.1z" fill="#fff" stroke="none"/><path d="M21.5 9v5"/><path d="m9.7 15.5 1.6 1.4 3-2.8" stroke="#FF4F18" stroke-width="1.6"/></svg></span><span class="wordmark">EDU<b>ADMIT</b></span></div>
</div>
<header class="topbar">
  <button class="top-icon" id="navToggle" title="Collapse menu" aria-label="Collapse menu" aria-expanded="true" hidden><i class="pi pi-bars"></i></button>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="top-search p-iconfield"><i class="pi pi-search"></i><input id="globalSearch" placeholder="Search students, receipts, admission no."><kbd>/</kbd></div>
  <div class="top-right">
    <button class="top-icon" title="Help"><i class="pi pi-question-circle"></i></button>
    <button class="top-icon" title="Notifications"><i class="pi pi-bell"></i><span class="p-badge-dot"></span></button>
    <button class="me" id="meBtn"><span class="p-avatar">AJ</span><span class="me-txt"><span>Anita Joseph</span><span class="me-role" id="meRole">Organisation admin</span></span><i class="pi pi-chevron-down" style="font-size:11px;color:var(--p-text-muted-color)"></i></button>
  </div>
</header>
<nav class="sidebar" id="sidebar"></nav>
<main class="main" id="main"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal-wrap" id="modalWrap"><div class="modal" id="modal"></div></div>
<div class="menu" id="menu"></div>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
